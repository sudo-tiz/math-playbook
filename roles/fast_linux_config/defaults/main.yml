---
fast_linux_config_repository: https://github.com/sudo-Tiz/fast_linux_config.git
fast_linux_config_version: d3aef251e1d1d5ad5078e273d17a03f870001ebf
fast_linux_config_checkout_path: /usr/local/src/fast_linux_config
fast_linux_config_users: []
fast_linux_config_packages:
  - git
  - neovim
  - tmux
  - zsh
fast_linux_config_set_login_shell: true
fast_linux_config_dotfiles:
  - {src: .bashrc, dest: .bashrc}
  - {src: .vimrc, dest: .vimrc}
  - {src: .zshrc, dest: .zshrc}
  - {src: init.lua, dest: .config/nvim/init.lua}
  - {src: tmux.conf, dest: .config/tmux/tmux.conf}
