---
- name: Manage fstab block
  ansible.builtin.blockinfile:
    path: "{{ fstab_mounts_file }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK fstab_mounts"
    block: |
      {% for item in fstab_mounts_entries %}
      {{ item.src }} {{ item.path }} {{ item.fstype | default(fstab_mounts_fstype) }} {{ item.opts | default(fstab_mounts_opts) }} {{ item.dump | default(fstab_mounts_dump) }} {{ item.passno | default(fstab_mounts_passno) }}
      {% endfor %}
  register: fstab_mounts_block

- name: Reload systemd mount units
  ansible.builtin.systemd:
    daemon_reload: true
  when: fstab_mounts_block is changed

- name: Resolve device symlinks for ephemeral mounts
  ansible.builtin.command:
    argv: [readlink, -f, --, "{{ item.src }}"]
  check_mode: false
  changed_when: false
  failed_when: false
  loop: "{{ fstab_mounts_entries }}"
  loop_control:
    label: "{{ item.src }}"
  when: item.src.startswith('/dev/')
  register: fstab_mounts_resolved_sources

- name: Mount filesystems
  ansible.posix.mount:
    src: "{{ item.1.stdout if (item.1.rc | default(1)) == 0 and (item.1.stdout | default('')) else item.0.src }}"
    path: "{{ item.0.path }}"
    fstype: "{{ item.0.fstype | default(fstab_mounts_fstype) }}"
    opts: "{{ item.0.opts | default(fstab_mounts_opts) }}"
    state: ephemeral
  loop: "{{ fstab_mounts_entries | zip(fstab_mounts_resolved_sources.results | default([])) | list }}"
  loop_control:
    label: "{{ item.0.path }}"

- name: Set mounted filesystem root permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
    mode: "{{ item.mode | default(omit) }}"
  loop: "{{ fstab_mounts_entries }}"
