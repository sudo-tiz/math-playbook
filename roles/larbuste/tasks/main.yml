---
- name: Validate inputs
  ansible.builtin.import_tasks: validate.yml

- name: Install editor and shell packages
  ansible.builtin.apt:
    name: "{{ larbuste_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the source checkout parent directory
  ansible.builtin.file:
    path: "{{ larbuste_checkout_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Fetch the pinned dotfiles revision
  ansible.builtin.git:
    repo: "{{ larbuste_repository }}"
    dest: "{{ larbuste_checkout_path }}"
    version: "{{ larbuste_version }}"
    update: true

- name: Configure each user
  ansible.builtin.include_tasks: user.yml
  loop: "{{ larbuste_users }}"
  loop_control:
    loop_var: larbuste_user
    label: "{{ larbuste_user.name }}"
