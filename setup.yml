---
- name: Configure server
  hosts: math_servers
  become: true
  gather_facts: true

  roles:
    - role: dns_resolver
      tags: [bootstrap, role-dns_resolver]
    - role: larbuste
      tags: [bootstrap, role-larbuste]
    - role: fstab_mounts
      tags: [bootstrap, role-fstab_mounts]
    - role: system_timezone
      tags: [bootstrap, role-system_timezone]
    - role: motd
      tags: [bootstrap, role-motd]
    - role: msmtp_relay
      tags: [bootstrap, role-msmtp_relay]
    - role: apt_upgrade_helpers
      tags: [bootstrap, role-apt_upgrade_helpers]
    - role: unattended_upgrades
      tags: [bootstrap, role-unattended_upgrades]
    - role: apt_full_upgrade
      tags: [role-apt_full_upgrade]
    - role: reboot_server
      tags: [role-reboot_server]

- name: Configure the host firewall
  hosts: firewall_hosts
  become: true
  gather_facts: true

  roles:
    - role: nftables_firewall
      tags: [role-nftables_firewall, create-vms]

- name: Configure virtual machines
  hosts: vm_hosts
  become: true
  gather_facts: true

  roles:
    - role: libvirt_vm
      tags: [role-libvirt_vm, create-vms]
